[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lecture-video-to-pdf"
version = "0.1.0"
description = "Local tool for extracting lecture slide PDFs and transcripts from videos or audio files."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Arthur Tao" }]
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "opencv-python>=4.8",
  "numpy>=1.24",
  "Pillow>=10",
  "img2pdf>=0.5",
  "scikit-image>=0.22",
  "PyYAML>=6.0",
  "httpx>=0.26",
  "python-multipart>=0.0.9",
  "opencc-python-reimplemented>=0.1.7",
]

[project.optional-dependencies]
asr = ["faster-whisper>=1.0"]
asr-cuda = [
  "faster-whisper>=1.0",
  "nvidia-cublas-cu12>=12.0",
  "nvidia-cuda-runtime-cu12>=12.0",
  "nvidia-cudnn-cu12>=9.0",
]
scene = ["scenedetect>=0.7"]
dev = ["pytest>=8.0"]

[project.scripts]
lecture-video-to-pdf = "lecture_video_to_pdf.cli:main"
lecture-video-studio = "lecture_video_to_pdf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lecture_video_to_pdf = ["web/*"]
